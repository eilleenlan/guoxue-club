<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成語列印練習卷｜小小國學所</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="idiom-paper.css"></head><body><main class="print-home"><a href="./idioms-unit.html">← 返回成語單元</a><h1>成語列印練習卷</h1><p>勾選已發布課次，選擇隨機練習或全部分回。每回選項與題目均在同一面 A4。題目與選項各自洗牌，產生後預覽及下載維持同一份結果。</p><fieldset id="lessons"><legend>選擇課次（可複選）</legend></fieldset><fieldset id="settings"><legend>出卷方式</legend><label>模式 <select id="mode"><option value="random">隨機練習（最多12題）</option><option value="all">全部分回練習</option></select></label> <label id="count-label" hidden>每回題數 <select id="count"><option value="10">10題</option><option value="12">12題</option></select></label><p>維持清楚字級；若單面放不下，會自動減少該回題數並重新分回。</p></fieldset><p id="selection"></p><button id="generate" disabled>產生練習卷</button> <button id="regenerate" disabled>重新產生／洗牌</button><p id="status" role="status" aria-live="polite"></p><section id="result" hidden><div class="paper-tools"><label>預覽 <select id="kind"><option value="questions">題目卷</option><option value="answers">答案卷</option></select></label><button id="previous">上一頁</button><span id="page-label"></span><button id="next">下一頁</button><a id="download-questions">下載題目卷 PDF</a><a id="download-answers">下載答案卷 PDF</a></div><p>下載 PDF 後開啟列印，選擇 A4、直式與符合頁面。預覽與 PDF 使用同一份頁面配置。</p><canvas id="preview" aria-label="試卷頁面預覽"></canvas></section></main><script type="module" src="idiom-paper-app.mjs"></script></body></html>
