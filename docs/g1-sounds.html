<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFF8F0"><title>一年級注音易錯辨音｜小小國學所</title><link rel="stylesheet" href="g1-sounds.css"></head><body><main><a class="back" href="./index.html">← 返回小小國學所首頁</a><header><h1>🔤 一年級注音易錯辨音</h1><p>考前急救練習</p></header><section id="start-panel"><p>看圖片，或讀注音短句，點一個正確讀音。</p><p>答錯的題目會留下來，陪你再練一次。</p><p id="bank-count" role="status">正在準備題目…</p><button id="start" disabled>開始練習 →</button></section><section id="question-panel" hidden aria-labelledby="question-title"><div class="progress"><span id="progress"></span><span id="wrong-count"></span></div><h2 id="question-title" tabindex="-1"></h2><div id="prompt"></div><div id="answers" aria-label="選擇一個完整讀音"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" hidden>下一題 →</button></section><section id="summary-panel" hidden><h2 id="summary-title" tabindex="-1"></h2><p id="summary-text"></p><button id="review" hidden>再練一次 →</button><button id="restart">重新練習全部題目</button></section><p id="error" role="alert"></p></main><script type="module" src="g1-sounds.mjs"></script></body></html>
