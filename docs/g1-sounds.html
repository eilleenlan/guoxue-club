<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFF8F0"><title>一年級注音易錯辨音｜小小國學所</title><link rel="stylesheet" href="g1-sounds.css"><link rel="stylesheet" href="g1-zhuyin-display.css"><link rel="stylesheet" href="g1-sounds-vertical.css"></head><body><main><a class="back" href="./index.html">← 返回小小國學所首頁</a><header><h1>ㄅㄆㄇ 一年級注音易錯辨音</h1></header><section id="start-panel"><p>看圖片，或讀注音短句，點一個正確讀音。</p><p>答錯的題目會留下來，陪你再練一次。</p><p id="bank-count" role="status">正在準備題目…</p><label class="round-choice" for="stage">選擇關卡<select id="stage"><option value="IMAGE">🌱 注音新手村</option><option value="CONTEXT">🚀 辨音探險隊</option><option value="BOSS">👑 魔王城</option><option value="MIXED">🎯 綜合挑戰</option></select></label><label class="round-choice" for="round-size">每輪題數<select id="round-size"><option value="5">5 題｜暖身一下</option><option value="10" selected>10 題｜每日推薦</option><option value="20">20 題｜加強練習</option><option value="all">全部題目｜考前總複習</option></select></label><button id="start" disabled>開始練習 →</button><button id="abandon-saved-round" type="button" class="abandon-round" hidden>放棄本輪</button><details class="parent-review"><summary>家長驗收</summary><p><a href="./g1-image-review.html">集中驗收 24 張題圖</a></p><p><a href="./g1-image-review.html?batch=2">查看第二批 10 張題圖</a></p><form id="inspect-form"><label for="inspect-number">題號</label><input id="inspect-number" inputmode="numeric" placeholder="例如 88"><button id="inspect-open" disabled>查看題目</button><p id="inspect-status" role="status"></p></form></details></section><section id="question-panel" hidden aria-labelledby="question-title"><div class="progress"><span id="progress"></span><span id="wrong-count"></span></div><h2 id="question-title" tabindex="-1"></h2><button id="inspect-back" type="button" hidden>← 返回選題</button><div id="prompt"></div><div id="answers" aria-label="選擇一個完整讀音"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" hidden>下一題 →</button><button id="abandon-round" type="button" class="abandon-round" hidden>放棄本輪</button></section><section id="summary-panel" hidden><h2 id="summary-title" tabindex="-1"></h2><p id="summary-text"></p><button id="review" hidden>再練一次 →</button><label class="round-choice" for="summary-stage">下一輪關卡<select id="summary-stage"><option value="IMAGE">🌱 注音新手村</option><option value="CONTEXT">🚀 辨音探險隊</option><option value="BOSS">👑 魔王城</option><option value="MIXED">🎯 綜合挑戰</option></select></label><label class="round-choice" for="summary-size">下一輪題數<select id="summary-size"><option value="5">5 題｜暖身一下</option><option value="10" selected>10 題｜每日推薦</option><option value="20">20 題｜加強練習</option><option value="all">全部題目｜考前總複習</option></select></label><button id="restart">開始新一輪</button></section><p id="error" role="alert"></p></main><dialog id="abandon-dialog" aria-labelledby="permit-title"><h2 id="permit-title">放棄本輪</h2><div id="abandon-warning"><p>本輪尚未完成，建議繼續練習。</p><button id="apply-permit" type="button">申請放棄</button><p id="permit-load-status" role="status"></p></div><form id="permit-form" hidden><p>看注音，輸入完整的繁體國字詞語。</p><div id="permit-reading"></div><label for="permit-answer">國字答案</label><input id="permit-answer" type="text" autocomplete="off" spellcheck="false"><button type="submit">檢查答案</button><p id="permit-feedback" role="status"></p></form><div id="abandon-confirmation" hidden><p>已取得許可。確定結束這一輪並保留待練錯題？</p><button id="confirm-abandon" type="button">確定放棄本輪</button><p id="abandon-error" role="alert"></p></div><button id="cancel-abandon" type="button">繼續練習</button></dialog><script type="module" src="g1-sounds.mjs"></script></body></html>
